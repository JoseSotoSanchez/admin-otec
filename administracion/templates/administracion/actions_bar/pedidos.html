<div class="col-md-8 col-sm-12">
    <div class="x_panel">
        <div class="x_content">
            <label for="proveedor">Proveedor:</label>
            <select id="proveedor" name="proveedor" class="form-control">
                {% for proveedor in proveedores %}
                    <option value="{{ proveedor.id }}">{{ proveedor.nombre }}</option>
                {% endfor %}
            </select>
            <table id="tablaFactura" class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Código de Barra</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Valor Neto</th>
                        <th>Ganancia</th>
                        <th>IVA</th>
                        <th>Precio Venta</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
            <div class="total-container">
                <h3>Total: $<span id="totalAmount">0</span></h3>
                <button type="button" class="btn btn-primary" onclick="enviarPedido()">Ingresar Factura</button>
            </div>
        </div>
    </div>
</div>
