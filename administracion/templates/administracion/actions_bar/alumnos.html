<div class="row">

    <div class="col-md-12">

        <div class="x_panel">

            <div class="x_content">

                <form
                    method="POST"
                    action="{% url 'alumnos' %}"
                    class="form-inline"
                >

                    {% csrf_token %}

                    <div class="form-group">

                        <select
                            name="id_curso"
                            class="form-control"
                            required
                        >

                            <option value="">
                                Seleccione curso
                            </option>

                            {% for curso in cursos %}

                                <option
                                    value="{{ curso.id }}"

                                    {% if curso_id == curso.id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ curso.codigo_curso }}
                                    -
                                    {{ curso.nombre }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="fa fa-search"></i>
                        Buscar
                    </button>

                </form>


                {% if curso_id %}

                <hr>

                <div
                    style="
                        display:flex;
                        align-items:center;
                        gap:12px;
                        flex-wrap:wrap;
                    "
                >

                    <strong
                        style="
                            margin-right:10px;
                        "
                    >
                        Total aspirantes:
                        {{ total }}
                    </strong>


                    <form
                        method="POST"
                        action="{% url 'alumnos_exportar' curso_id %}"
                        style="
                            display:inline-block;
                            margin:0;
                        "
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-success"
                            style="margin:0;"
                        >
                            <i class="fa fa-file-excel-o"></i>

                            Descargar todos
                        </button>

                    </form>


                    <form
                        method="POST"
                        action="{% url 'alumnos_exportar_pagados' curso_id %}"
                        style="
                            display:inline-block;
                            margin:0;
                        "
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-info"
                            style="margin:0;"
                        >
                            <i class="fa fa-download"></i>

                            Descargar pagados
                        </button>

                    </form>

                </div>

            {% endif %}

            </div>

        </div>

    </div>

</div>
