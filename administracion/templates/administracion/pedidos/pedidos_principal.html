<div class="row right_col">
    <div class="col-md-4 col-sm-12">
        <div class="x_panel">
            <div class="x_title">
                <h2>Listado de Productos</h2>
                <div class="clearfix"></div>
            </div>
            <div class="x_content">
                <input type="text" class="form-control" placeholder="Buscar..." id="searchInput">
                <table id="tablaProductos" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Código de Barra</th>
                             
                            <th>Producto</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for producto in productos %}
                        <tr>
                            <td>
                                <input type="checkbox" class="producto-checkbox" data-codigo-barra="{{ producto.codigo_barra }}" data-producto="{{ producto.nombre }}" data-valor-neto="{{ producto.precio_neto }}">
                            </td>
                            <td>{{ producto.codigo_barra }}</td>
                           
                            <td>{{ producto.nombre }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    {% if actions_bar %}
    {% include actions_bar %}
    {% endif %}
</div>
