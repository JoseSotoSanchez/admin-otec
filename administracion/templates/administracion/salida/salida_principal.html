<link href="/static/css/generic_table.css" rel="stylesheet">

<div class="right_col" role="main">
  <div class="">
    <div class="page-title">
      <div class="title_left">
        <h3>{{title}}</h3>
      </div>
    </div>

    <div class="clearfix"></div>

    <div class="row">
      <div class="col-md-8 col-sm-8 col-xs-8">

        {% if actions_bar %}
        {% include actions_bar with tipo_salida=tipo_salida %}
        {% endif %}

        {% load custom_filters %}

        <div class="x_panel">
          <div class="x_content">
            <table id="tabla_carrito" class="table table-striped table-bordered">
              <thead>
                <tr>
                  <th>Codigo Barra</th>
                  <th>Producto</th>
                  <th>Cantidad</th>
                  <th>Precio</th>
                  <th>Sub Total</th>
                  <th>Retirar</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
        </div>
      </div>


      <div class="col-md-4 col-sm-4 col-xs-4">

        <div class="x_panel">
          <div class="x_content">
            <hr>
            <div id="resumen_salida">
            </div>
            <hr>
            <h1>Total: <strong id="total_venta"></strong></h1>
            <button type="button" class="btn btn-success" style="width: 100%;" onclick="carrito.actions.send_pedido()">Terminar</button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
